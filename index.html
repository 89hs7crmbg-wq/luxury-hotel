<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#171713">

    <title>THE HOTEL — Сургут</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@400;500&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- =========================
         ОСНОВНОЙ ЭКРАН
    ========================== -->

    <main class="screen">

        <!-- Верхняя панель -->
        <header class="topbar">

            <button
                class="menu-button"
                id="menuButton"
                type="button"
                aria-label="Открыть меню"
            >
                <span></span>
                <span></span>
            </button>

            <button
                class="brand"
                id="brandButton"
                type="button"
            >
                THE HOTEL
            </button>

            <button
                class="book-button"
                id="bookButton"
                type="button"
            >
                БРОНИРОВАТЬ
            </button>

        </header>


        <!-- Контент кадра -->
        <section class="frame">

            <!-- Фото -->
            <div class="photo-box">

                <img
                    id="photo"
                    src="IMG_8684.png"
                    alt="THE HOTEL, Сургут"
                    draggable="false"
                >

                <div class="photo-number">
                    <span id="frameNumber">00</span>
                </div>

            </div>


            <!-- Текст под фотографией -->
            <div class="story">

                <div class="story-meta">

                    <span id="category">
                        ОТЕЛЬ
                    </span>

                    <span class="meta-line"></span>

                    <span>
                        СУРГУТ
                    </span>

                </div>


                <h1 id="title">
                    ВРЕМЯ<br>
                    ОСТАНОВИТЬСЯ
                </h1>


                <p id="description">
                    Место, где город
                    наконец становится тише.
                </p>

            </div>

        </section>


        <!-- Стрелки -->
        <div class="navigation">

            <button
                id="previous"
                type="button"
                aria-label="Предыдущий кадр"
            >
                <span>←</span>
            </button>

            <div class="progress">
                <span id="currentFrame">01</span>
                <span class="progress-line"></span>
                <span>15</span>
            </div>

            <button
                id="next"
                type="button"
                aria-label="Следующий кадр"
            >
                <span>→</span>
            </button>

        </div>


        <!-- Нижняя навигация -->
        <nav class="bottom-bar">

            <button
                class="bar-item active"
                type="button"
                data-index="0"
            >
                <span>00</span>
                ОТЕЛЬ
            </button>

            <button
                class="bar-item"
                type="button"
                data-index="1"
            >
                <span>01</span>
                ПРИБЫТИЕ
            </button>

            <button
                class="bar-item"
                type="button"
                data-index="3"
            >
                <span>03</span>
                ПРОСТРАНСТВО
            </button>

            <button
                class="bar-item"
                type="button"
                data-index="8"
            >
                <span>08</span>
                НОМЕРА
            </button>

            <button
                class="bar-item"
                type="button"
                data-index="11"
            >
                <span>11</span>
                ДЕТАЛИ
            </button>

        </nav>

    </main>


    <!-- =========================
         МЕНЮ
    ========================== -->

    <aside
        class="overlay menu-overlay"
        id="menuOverlay"
        aria-hidden="true"
    >

        <div class="overlay-content">

            <div class="overlay-top">

                <span>
                    THE HOTEL / СУРГУТ
                </span>

                <button
                    id="closeMenu"
                    type="button"
                >
                    ЗАКРЫТЬ
                </button>

            </div>


            <div class="menu-title">

                <span>НАВИГАЦИЯ</span>

                <h2>
                    ВАШЕ<br>
                    ПРОСТРАНСТВО
                </h2>

            </div>


            <div class="menu-links">

                <button type="button" data-index="0">
                    <small>00</small>
                    <strong>ОТЕЛЬ</strong>
                    <i>→</i>
                </button>

                <button type="button" data-index="1">
                    <small>01</small>
                    <strong>ПРИБЫТИЕ</strong>
                    <i>→</i>
                </button>

                <button type="button" data-index="3">
                    <small>03</small>
                    <strong>ПРОСТРАНСТВО</strong>
                    <i>→</i>
                </button>

                <button type="button" data-index="8">
                    <small>08</small>
                    <strong>НОМЕРА</strong>
                    <i>→</i>
                </button>

                <button type="button" data-index="11">
                    <small>11</small>
                    <strong>ДЕТАЛИ</strong>
                    <i>→</i>
                </button>

            </div>


            <div class="overlay-footer">
                <span>СУРГУТ / РОССИЯ</span>
                <span>THE HOTEL</span>
            </div>

        </div>

    </aside>


    <!-- =========================
         БРОНИРОВАНИЕ
    ========================== -->

    <aside
        class="overlay booking-overlay"
        id="bookingOverlay"
        aria-hidden="true"
    >

        <div class="overlay-content">

            <div class="overlay-top">

                <span>
                    THE HOTEL / СУРГУТ
                </span>

                <button
                    id="closeBooking"
                    type="button"
                >
                    ЗАКРЫТЬ
                </button>

            </div>


            <div class="booking-title">

                <span>БРОНИРОВАНИЕ</span>

                <h2>
                    ВАШЕ<br>
                    ВРЕМЯ
                </h2>

                <p>
                    Выберите даты проживания
                    и количество гостей.
                </p>

            </div>


            <div class="booking-fields">

                <button type="button">
                    <small>ЗАСЕЛЕНИЕ</small>
                    <strong>ДД / ММ / ГГГГ</strong>
                </button>

                <button type="button">
                    <small>ВЫЕЗД</small>
                    <strong>ДД / ММ / ГГГГ</strong>
                </button>

                <button type="button">
                    <small>ГОСТИ</small>
                    <strong>2 ГОСТЯ</strong>
                </button>

                <button
                    class="request-button"
                    type="button"
                >
                    ОСТАВИТЬ ЗАПРОС
                    <span>→</span>
                </button>

            </div>


            <div class="overlay-footer">
                <span>СУРГУТ / РОССИЯ</span>
                <span>THE HOTEL</span>
            </div>

        </div>

    </aside>

</div>

<script src="script.js"></script>

</body>
</html>
