<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THE HOTEL</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="header">

        <button class="brand" id="homeBtn">
            THE HOTEL
        </button>

        <div class="header-center">
            МОСКВА / РОССИЯ
        </div>

        <button class="menu-button" id="menuButton">
            <span>МЕНЮ</span>
            <i></i>
        </button>

    </header>


    <main class="main">

        <section class="visual">

            <div class="image-wrap" id="imageWrap">

                <img
                    id="mainImage"
                    src="IMG_8684.png"
                    alt="THE HOTEL"
                >

            </div>

            <div class="image-number">

                <span id="currentNumber">01</span>

                <span class="line"></span>

                <span>15</span>

            </div>

            <div class="image-counter">
                ИССЛЕДОВАТЬ
            </div>

        </section>


        <section class="info">

            <div class="info-top">

                <span class="category" id="category">
                    ОТЕЛЬ
                </span>

                <span class="coordinates">
                    55°45' СШ / 37°37' ВД
                </span>

            </div>


            <div class="content">

                <div class="content-index" id="contentIndex">
                    00
                </div>

                <div class="content-main">

                    <h1 id="title">
                        THE<br>
                        HOTEL
                    </h1>

                    <p id="description">
                        Пространство,
                        созданное для
                        тишины.
                    </p>

                </div>

            </div>


            <nav class="navigation">

                <button
                    class="nav-item active"
                    data-section="hotel"
                >
                    <span>01</span>
                    ОТЕЛЬ
                </button>

                <button
                    class="nav-item"
                    data-section="arrival"
                >
                    <span>02</span>
                    ПРИБЫТИЕ
                </button>

                <button
                    class="nav-item"
                    data-section="space"
                >
                    <span>03</span>
                    ПРОСТРАНСТВО
                </button>

                <button
                    class="nav-item"
                    data-section="rooms"
                >
                    <span>04</span>
                    НОМЕРА
                </button>

                <button
                    class="nav-item"
                    data-section="details"
                >
                    <span>05</span>
                    ДЕТАЛИ
                </button>

            </nav>


            <div class="controls">

                <button id="prevButton" aria-label="Предыдущий кадр">
                    ←
                </button>

                <button
                    class="book-button"
                    id="bookingButton"
                >
                    ЗАБРОНИРОВАТЬ
                </button>

                <button id="nextButton" aria-label="Следующий кадр">
                    →
                </button>

            </div>

        </section>

    </main>


    <!-- МЕНЮ -->

    <div class="menu-overlay" id="menuOverlay">

        <div class="menu-inner">

            <div class="menu-heading">
                НАВИГАЦИЯ
            </div>

            <button data-section="hotel">
                <span>01</span>
                ОТЕЛЬ
            </button>

            <button data-section="arrival">
                <span>02</span>
                ПРИБЫТИЕ
            </button>

            <button data-section="space">
                <span>03</span>
                ПРОСТРАНСТВО
            </button>

            <button data-section="rooms">
                <span>04</span>
                НОМЕРА
            </button>

            <button data-section="details">
                <span>05</span>
                ДЕТАЛИ
            </button>

            <button id="closeMenu">
                ЗАКРЫТЬ ×
            </button>

        </div>

    </div>


    <!-- БРОНИРОВАНИЕ -->

    <div class="booking-panel" id="bookingPanel">

        <button id="closeBooking">
            ЗАКРЫТЬ ×
        </button>

        <div class="booking-content">

            <span>ПРОЖИВАНИЕ</span>

            <h2>
                ВЫБЕРИТЕ<br>
                СВОЙ<br>
                НОМЕР
            </h2>

            <div class="booking-row">

                <div>
                    <small>ЗАСЕЛЕНИЕ</small>
                    <strong>— / — / —</strong>
                </div>

                <div>
                    <small>ВЫЕЗД</small>
                    <strong>— / — / —</strong>
                </div>

                <button id="requestButton">
                    ОСТАВИТЬ ЗАПРОС
                </button>

            </div>

        </div>

    </div>


</div>

<script src="script.js"></script>

</body>
</html>
