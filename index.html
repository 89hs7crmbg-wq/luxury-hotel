<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#11110f">

    <title>THE HOTEL — Сургут</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="site">

    <!-- ФОТО -->
    <main class="gallery">

        <div class="image-wrap">
            <img id="mainImage" src="IMG_8684.png" alt="THE HOTEL Сургут">
        </div>

        <div class="image-overlay"></div>


        <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
        <header class="top">

            <button class="burger" id="openMenu" aria-label="Меню">
                <span></span>
                <span></span>
            </button>

            <button class="logo" id="logoButton">
                THE HOTEL
            </button>

            <button class="booking-button" id="openBooking">
                БРОНИРОВАТЬ
            </button>

        </header>


        <!-- ТЕКСТ -->
        <section class="content">

            <div class="eyebrow">
                <span id="category">ОТЕЛЬ</span>
                <i></i>
                <span id="sceneNumber">00</span>
            </div>

            <h1 id="title">THE HOTEL</h1>

            <p id="description">
                Пространство,<br>
                созданное для тишины.
            </p>

        </section>


        <!-- СТРЕЛКИ -->
        <div class="arrows">

            <button id="prev" aria-label="Предыдущий кадр">
                ←
            </button>

            <button id="next" aria-label="Следующий кадр">
                →
            </button>

        </div>


        <!-- НОМЕР -->
        <div class="counter">
            <span id="current">01</span>
            <span class="line"></span>
            <span>15</span>
        </div>


        <!-- НИЖНИЙ BAR -->
        <nav class="bottom-bar">

            <button class="bar-item active" data-start="0">
                <span>00</span>
                <b>ОТЕЛЬ</b>
            </button>

            <button class="bar-item" data-start="1">
                <span>01</span>
                <b>ПРИБЫТИЕ</b>
            </button>

            <button class="bar-item" data-start="3">
                <span>03</span>
                <b>ПРОСТРАНСТВО</b>
            </button>

            <button class="bar-item" data-start="8">
                <span>08</span>
                <b>НОМЕРА</b>
            </button>

            <button class="bar-item" data-start="11">
                <span>11</span>
                <b>ДЕТАЛИ</b>
            </button>

        </nav>

    </main>


    <!-- =========================
         МЕНЮ
    ========================== -->

    <div class="panel menu-panel" id="menuPanel">

        <div class="panel-inner">

            <div class="panel-top">
                <span>THE HOTEL / СУРГУТ</span>

                <button id="closeMenu">
                    ЗАКРЫТЬ
                </button>
            </div>


            <div class="menu-heading">
                <small>НАВИГАЦИЯ</small>

                <h2>
                    ВАШЕ<br>
                    ПРОСТРАНСТВО
                </h2>
            </div>


            <div class="menu-list">

                <button data-start="0">
                    <span>00</span>
                    <b>ОТЕЛЬ</b>
                    <i>→</i>
                </button>

                <button data-start="1">
                    <span>01</span>
                    <b>ПРИБЫТИЕ</b>
                    <i>→</i>
                </button>

                <button data-start="3">
                    <span>03</span>
                    <b>ПРОСТРАНСТВО</b>
                    <i>→</i>
                </button>

                <button data-start="8">
                    <span>08</span>
                    <b>НОМЕРА</b>
                    <i>→</i>
                </button>

                <button data-start="11">
                    <span>11</span>
                    <b>ДЕТАЛИ</b>
                    <i>→</i>
                </button>

            </div>


            <div class="panel-bottom">
                <span>СУРГУТ / РОССИЯ</span>
                <span>THE HOTEL</span>
            </div>

        </div>

    </div>


    <!-- =========================
         БРОНИРОВАНИЕ
    ========================== -->

    <div class="panel booking-panel" id="bookingPanel">

        <div class="booking-inner">

            <div class="panel-top">
                <span>THE HOTEL / СУРГУТ</span>

                <button id="closeBooking">
                    ЗАКРЫТЬ
                </button>
            </div>


            <div class="booking-heading">

                <small>БРОНИРОВАНИЕ</small>

                <h2>
                    ВАШЕ<br>
                    ВРЕМЯ
                </h2>

                <p>
                    Выберите даты проживания
                    и количество гостей.
                </p>

            </div>


            <div class="booking-form">

                <button class="field">
                    <span>ЗАСЕЛЕНИЕ</span>
                    <b>ДД / ММ / ГГГГ</b>
                </button>

                <button class="field">
                    <span>ВЫЕЗД</span>
                    <b>ДД / ММ / ГГГГ</b>
                </button>

                <button class="field">
                    <span>ГОСТИ</span>
                    <b>2 ГОСТЯ</b>
                </button>

                <button class="submit-booking">
                    ОСТАВИТЬ ЗАПРОС
                    <span>→</span>
                </button>

            </div>


            <div class="panel-bottom">
                <span>СУРГУТ / РОССИЯ</span>
                <span>THE HOTEL</span>
            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
