<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <meta
        name="description"
        content="Иммерсивное путешествие по отелю."
    >
    <meta
        name="theme-color"
        content="#080807"
    >
    <title>Отель</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="is-loading">
    <!-- =====================================
         PRELOADER
    ====================================== -->
    <div class="preloader" id="preloader">
        <div class="preloader__line"></div>
        <span class="preloader__text">
            ЗАГРУЗКА
        </span>
    </div>
    <!-- =====================================
         HEADER
    ====================================== -->
    <header class="header">
        <a
            href="#hero"
            class="logo"
            aria-label="На главную"
        >
            ОТЕЛЬ
        </a>
        <div class="header__right">
            <span class="header__location">
                РОССИЯ
            </span>
            <button
                class="menu-button"
                id="menuButton"
                type="button"
                aria-label="Открыть меню"
            >
                <span></span>
                <span></span>
            </button>
        </div>
    </header>
    <main>
        <!-- =====================================
             КАДР 00
             ОБЩИЙ ВИД ОТЕЛЯ
        ====================================== -->
        <section
            class="hero"
            id="hero"
        >
            <div class="hero__image">
                <img
                    src="IMG_8684.png"
                    alt="Отель"
                    fetchpriority="high"
                >
            </div>
            <div class="hero__overlay"></div>
            <div class="hero__content">
                <p class="eyebrow">
                    МЕСТО МЕЖДУ МИРОМ И ТИШИНОЙ
                </p>
                <h1>
                    ОТЕЛЬ
                </h1>
                <p class="hero__intro">
                    Путешествие сквозь архитектуру,
                    пространство и атмосферу.
                </p>
            </div>
            <div class="scroll-indicator">
                <span>
                    ЛИСТАЙТЕ, ЧТОБЫ ВОЙТИ
                </span>
                <span class="scroll-indicator__line"></span>
            </div>
        </section>
        <!-- =====================================
             ОСНОВНОЕ ПУТЕШЕСТВИЕ
        ====================================== -->
        <section
            class="journey"
            id="journey"
        >
            <div
                class="journey__stage"
                id="journeyStage"
            >
                <!-- КАДР 01 -->
                <div
                    class="journey__frame is-active"
                    data-index="1"
                    data-name="ПРИБЫТИЕ"
                    data-title="ПРИБЫТИЕ"
                    data-description="Путешествие начинается."
                >
                    <img
                        src="IMG_8685.png"
                        alt="Прибытие в отель"
                        loading="lazy"
                    >
                </div>
                <!-- КАДР 02 -->
                <div
                    class="journey__frame"
                    data-index="2"
                    data-name="ВХОД"
                    data-title="ВХОД"
                    data-description="Момент, когда внешний мир остаётся позади."
                >
                    <img
                        src="IMG_8687.png"
                        alt="Вход в отель"
                        loading="lazy"
                    >
                </div>
                <!-- КАДР 03 -->
                <div
                    class="journey__frame"
                    data-index="3"
                    data-name="ЛОББИ"
                    data-title="ЛОББИ"
                    data-description="Первое пространство отеля."
                >
                    <img
                        src="IMG_8688.png"
                        alt="Лобби отеля"
                        loading="lazy"
                    >
                </div>
                <!-- КАДР 04 -->
                <div
                    class="journey__frame"
                    data-index="4"
                    data-name="ГЛУБЖЕ"
                    data-title="ГЛУБЖЕ"
                    data-description="Путешествие продолжается внутри."
                >
                    <img
                        src="IMG_8691.png"
                        alt="Внутреннее пространство отеля"
                        loading="lazy"
                    >
                </div>
                <!-- КАДР 05 -->
                <div
                    class="journey__frame"
                    data-index="5"
                    data-name="ЛИФТ"
                    data-title="ЛИФТ"
                    data-description="Публичные пространства остаются позади."
                >
                    <img
                        src="IMG_8692.png"
                        alt="Лифт"
                        loading="lazy"
                    >
                </div>
                <!-- КАДР 06 -->
                <div
                    class="journey__frame"
                    data-index="6"
                    data-name="ОТКРЫВАЕТСЯ"
                    data-title="ОТКРЫВАЕТСЯ"
                    data-description="Новый уровень раскрывается перед вами."
                >
                    <img
                        src="IMG_8693.png"
                        alt="Открывающийся лифт"
                        loading="lazy"
                    >
                </div>
                <!-- КАДР 07 -->
                <div
                    class="journey__frame"
                    data-index="7"
                    data-name="ВНУТРИ"
                    data-title="ВНУТРИ"
                    data-description="Начинается приватная часть путешествия."
                >
                    <img
                        src="IMG_8694.png"
                        alt="Внутри отеля"
                        loading="lazy"
                    >
                </div>
                <!-- КАДР 08 -->
                <div
                    class="journey__frame"
                    data-index="8"
                    data-name="КОРИДОР"
                    data-title="КОРИДОР"
                    data-description="Тихий путь к вашему номеру."
                >
                    <img
                        src="IMG_8695.png"
                        alt="Коридор отеля"
                        loading="lazy"
                    >
                </div>
                <!-- КАДР 09 -->
                <div
                    class="journey__frame"
                    data-index="9"
                    data-name="ДВЕРЬ"
                    data-title="ДВЕРЬ"
                    data-description="Последний шаг перед входом."
                >
                    <img
                        src="IMG_8697.png"
                        alt="Дверь номера"
                        loading="lazy"
                    >
                </div>
                <!-- КАДР 10 -->
                <div
                    class="journey__frame"
                    data-index="10"
                    data-name="НОМЕР"
                    data-title="НОМЕР"
                    data-description="Ваше личное пространство."
                >
                    <img
                        src="IMG_8698.png"
                        alt="Номер отеля"
                        loading="lazy"
                    >
                </div>
                <!-- КАДР 11 -->
                <div
                    class="journey__frame"
                    data-index="11"
                    data-name="СПАЛЬНЯ"
                    data-title="СПАЛЬНЯ"
                    data-description="Пространство для полного покоя."
                >
                    <img
                        src="IMG_8699.png"
                        alt="Спальная зона"
                        loading="lazy"
                    >
                </div>
                <!-- КАДР 12 -->
                <div
                    class="journey__frame"
                    data-index="12"
                    data-name="ГОСТИНАЯ"
                    data-title="ГОСТИНАЯ"
                    data-description="Место, где можно замедлиться."
                >
                    <img
                        src="IMG_8700.png"
                        alt="Гостиная"
                        loading="lazy"
                    >
                </div>
                <!-- КАДР 13 -->
                <div
                    class="journey__frame"
                    data-index="13"
                    data-name="ВИД"
                    data-title="ВИД"
                    data-description="Город становится частью пространства."
                >
                    <img
                        src="IMG_8702.png"
                        alt="Вид из номера"
                        loading="lazy"
                    >
                </div>
                <!-- КАДР 14 -->
                <div
                    class="journey__frame"
                    data-index="14"
                    data-name="ВАННАЯ"
                    data-title="ВАННАЯ"
                    data-description="Последнее приватное пространство."
                >
                    <img
                        src="IMG_8703.png"
                        alt="Ванная комната"
                        loading="lazy"
                    >
                </div>
            </div>
            <!-- =====================================
                 ИНФОРМАЦИЯ О КАДРЕ
            ====================================== -->
            <div class="scene-info">
                <div class="scene-info__number">
                    <span id="sceneNumber">
                        01
                    </span>
                    <span>
                        / 14
                    </span>
                </div>
                <div
                    class="scene-info__name"
                    id="sceneName"
                >
                    ПРИБЫТИЕ
                </div>
            </div>
            <!-- =====================================
                 ОПИСАНИЕ
            ====================================== -->
            <div class="scene-copy">
                <p class="scene-copy__eyebrow">
                    ПУТЕШЕСТВИЕ
                </p>
                <h2 id="sceneTitle">
                    ПРИБЫТИЕ
                </h2>
                <p id="sceneDescription">
                    Путешествие начинается.
                </p>
            </div>
            <!-- =====================================
                 ПРОГРЕСС
            ====================================== -->
            <div class="journey-progress">
                <div
                    class="journey-progress__bar"
                    id="progressBar"
                ></div>
            </div>
        </section>
        <!-- =====================================
             ФИНАЛ
        ====================================== -->
        <section class="final">
            <div class="final__content">
                <p class="eyebrow">
                    ВПЕЧАТЛЕНИЕ
                </p>
                <h2>
                    ОСТАНЬТЕСЬ<br>
                    ЕЩЁ
                </h2>
                <p>
                    Некоторые места посещают.
                    Другие проживают.
                </p>
                <a
                    href="#"
                    class="final__button"
                >
                    ЗАБРОНИРОВАТЬ НОМЕР
                </a>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
