<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="description"
        content="Путешествие по пространству отеля."
    >

    <meta
        name="theme-color"
        content="#080807"
    >

    <title>Отель</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================
         PRELOADER
    ====================================== -->

    <div class="preloader" id="preloader">

        <div class="preloader__line"></div>

        <span class="preloader__text">
            ЗАГРУЗКА
        </span>

    </div>


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="header">

        <a
            href="#hero"
            class="logo"
            aria-label="На главную"
        >
            ОТЕЛЬ
        </a>

        <div class="header__right">

            <span class="header__location">
                РОССИЯ
            </span>

            <button
                class="menu-button"
                id="menuButton"
                type="button"
                aria-label="Открыть меню"
            >
                <span></span>
                <span></span>
            </button>

        </div>

    </header>


    <main>

        <!-- =====================================
             HERO / КАДР 00
        ====================================== -->

        <section
            class="hero"
            id="hero"
        >

            <div class="hero__image">

                <img
                    src="00-the-hotel.jpg"
                    alt="Отель"
                    fetchpriority="high"
                >

            </div>

            <div class="hero__overlay"></div>


            <div class="hero__content">

                <p class="eyebrow">
                    МЕСТО МЕЖДУ МИРОМ И ТИШИНОЙ
                </p>

                <h1>
                    ОТЕЛЬ
                </h1>

                <p class="hero__intro">
                    Путешествие сквозь архитектуру,
                    пространство и атмосферу.
                </p>

            </div>


            <div class="scroll-indicator">

                <span>
                    ЛИСТАЙТЕ, ЧТОБЫ ВОЙТИ
                </span>

                <span class="scroll-indicator__line"></span>

            </div>

        </section>


        <!-- =====================================
             CINEMATIC JOURNEY
        ====================================== -->

        <section
            class="journey"
            id="journey"
        >

            <div
                class="journey__stage"
                id="journeyStage"
            >


                <!-- =================================
                     КАДР 01
                ================================== -->

                <div
                    class="journey__frame is-active"
                    data-index="1"
                    data-name="ПРИБЫТИЕ"
                    data-title="ПРИБЫТИЕ"
                    data-description="Путешествие начинается."
                >

                    <img
                        src="01-arrival.jpg"
                        alt="Прибытие в отель"
                        loading="lazy"
                    >

                </div>


                <!-- =================================
                     КАДР 02
                ================================== -->

                <div
                    class="journey__frame"
                    data-index="2"
                    data-name="ПОРОГ"
                    data-title="ПОРОГ"
                    data-description="Момент, когда внешний мир остаётся позади."
                >

                    <img
                        src="02-threshold.jpg"
                        alt="Вход в отель"
                        loading="lazy"
                    >

                </div>


                <!-- =================================
                     КАДР 03
                ================================== -->

                <div
                    class="journey__frame"
                    data-index="3"
                    data-name="ЛОББИ"
                    data-title="ЛОББИ"
                    data-description="Первое пространство отеля."
                >

                    <img
                        src="03-lobby.jpg"
                        alt="Лобби отеля"
                        loading="lazy"
                    >

                </div>


                <!-- =================================
                     КАДР 04
                ================================== -->

                <div
                    class="journey__frame"
                    data-index="4"
                    data-name="ГЛУБЖЕ"
                    data-title="ГЛУБЖЕ"
                    data-description="Путешествие продолжается внутри."
                >

                    <img
                        src="04-deeper-in.jpg"
                        alt="Внутреннее пространство отеля"
                        loading="lazy"
                    >

                </div>


                <!-- =================================
                     КАДР 05
                ================================== -->

                <div
                    class="journey__frame"
                    data-index="5"
                    data-name="ЛИФТ"
                    data-title="ЛИФТ"
                    data-description="Публичные пространства остаются позади."
                >

                    <img
                        src="05-elevator.jpg"
                        alt="Лифт"
                        loading="lazy"
                    >

                </div>


                <!-- =================================
                     КАДР 06
                ================================== -->

                <div
                    class="journey__frame"
                    data-index="6"
                    data-name="ОТКРЫВАЕТСЯ"
                    data-title="ОТКРЫВАЕТСЯ"
                    data-description="Новый уровень раскрывается перед вами."
                >

                    <img
                        src="06-open.jpg"
                        alt="Открывающийся лифт"
                        loading="lazy"
                    >

                </div>


                <!-- =================================
                     КАДР 07
                ================================== -->

                <div
                    class="journey__frame"
                    data-index="7"
                    data-name="ВНУТРИ"
                    data-title="ВНУТРИ"
                    data-description="Начинается приватная часть путешествия."
                >

                    <img
                        src="07-inside.jpg"
                        alt="Внутри отеля"
                        loading="lazy"
                    >

                </div>


                <!-- =================================
                     КАДР 08
                ================================== -->

                <div
                    class="journey__frame"
                    data-index="8"
                    data-name="КОРИДОР"
                    data-title="КОРИДОР"
                    data-description="Тихий путь к вашему номеру."
                >

                    <img
                        src="08-the-corridor.jpg"
                        alt="Коридор отеля"
                        loading="lazy"
                    >

                </div>


                <!-- =================================
                     КАДР 09
                ================================== -->

                <div
                    class="journey__frame"
                    data-index="9"
                    data-name="ДВЕРЬ"
                    data-title="ДВЕРЬ"
                    data-description="Последний шаг перед входом."
                >

                    <img
                        src="09-the-door.jpg"
                        alt="Дверь номера"
                        loading="lazy"
                    >

                </div>


                <!-- =================================
                     КАДР 10
                ================================== -->

                <div
                    class="journey__frame"
                    data-index="10"
                    data-name="НОМЕР"
                    data-title="НОМЕР"
                    data-description="Ваше личное пространство."
                >

                    <img
                        src="10-the-suite.jpg"
                        alt="Номер отеля"
                        loading="lazy"
                    >

                </div>


                <!-- =================================
                     КАДР 11
                ================================== -->

                <div
                    class="journey__frame"
                    data-index="11"
                    data-name="СПАЛЬНЯ"
                    data-title="СПАЛЬНЯ"
                    data-description="Пространство для полного покоя."
                >

                    <img
                        src="11-the-bed.jpg"
                        alt="Спальная зона"
                        loading="lazy"
                    >

                </div>


                <!-- =================================
                     КАДР 12
                ================================== -->

                <div
                    class="journey__frame"
                    data-index="12"
                    data-name="ГОСТИНАЯ"
                    data-title="ГОСТИНАЯ"
                    data-description="Место, где можно замедлиться."
                >

                    <img
                        src="12-the-lounge.jpg"
                        alt="Гостиная"
                        loading="lazy"
                    >

                </div>


                <!-- =================================
                     КАДР 13
                ================================== -->

                <div
                    class="journey__frame"
                    data-index="13"
                    data-name="ВИД"
                    data-title="ВИД"
                    data-description="Город становится частью пространства."
                >

                    <img
                        src="13-the-view.jpg"
                        alt="Вид из номера"
                        loading="lazy"
                    >

                </div>


                <!-- =================================
                     КАДР 14
                ================================== -->

                <div
                    class="journey__frame"
                    data-index="14"
                    data-name="ВАННАЯ"
                    data-title="ВАННАЯ"
                    data-description="Последнее приватное пространство."
                >

                    <img
                        src="14-the-bath.jpg"
                        alt="Ванная комната"
                        loading="lazy"
                    >

                </div>

            </div>


            <!-- =====================================
                 ИНФОРМАЦИЯ О СЦЕНЕ
            ====================================== -->

            <div class="scene-info">

                <div class="scene-info__number">

                    <span id="sceneNumber">
                        01
                    </span>

                    <span>
                        / 14
                    </span>

                </div>

                <div
                    class="scene-info__name"
                    id="sceneName"
                >
                    ПРИБЫТИЕ
                </div>

            </div>


            <!-- =====================================
                 ТЕКСТ СЦЕНЫ
            ====================================== -->

            <div class="scene-copy">

                <p class="scene-copy__eyebrow">
                    ПУТЕШЕСТВИЕ
                </p>

                <h2 id="sceneTitle">
                    ПРИБЫТИЕ
                </h2>

                <p id="sceneDescription">
                    Путешествие начинается.
                </p>

            </div>


            <!-- =====================================
                 ПРОГРЕСС
            ====================================== -->

            <div class="journey-progress">

                <div
                    class="journey-progress__bar"
                    id="progressBar"
                ></div>

            </div>

        </section>


        <!-- =====================================
             FINAL
        ====================================== -->

        <section class="final">

            <div class="final__content">

                <p class="eyebrow">
                    ВПЕЧАТЛЕНИЕ
                </p>

                <h2>
                    ОСТАНЬТЕСЬ<br>
                    ЕЩЁ
                </h2>

                <p>
                    Некоторые места посещают.
                    Другие проживают.
                </p>

                <a
                    href="#"
                    class="final__button"
                >
                    ЗАБРОНИРОВАТЬ НОМЕР
                </a>

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>
</html>
