<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>THE HOTEL</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <button class="brand" id="homeBtn">
            THE HOTEL
        </button>

        <div class="header-location">
            МОСКВА / РОССИЯ
        </div>

        <button class="menu-button" id="menuButton">
            <span>МЕНЮ</span>

            <i>
                <b></b>
                <b></b>
            </i>
        </button>

    </header>


    <!-- MAIN -->

    <main class="main">

        <!-- IMAGE -->

        <section class="visual">

            <div class="image-wrap" id="imageWrap">

                <img
                    id="mainImage"
                    src="IMG_8684.png"
                    alt="THE HOTEL"
                >

            </div>

            <div class="image-number">

                <span id="currentNumber">01</span>

                <span class="number-line"></span>

                <span>15</span>

            </div>

            <div class="image-label">
                ИССЛЕДОВАТЬ
            </div>

        </section>


        <!-- INFORMATION -->

        <section class="info">

            <div class="info-top">

                <span id="category">
                    ОТЕЛЬ
                </span>

                <span>
                    55°45' СШ / 37°37' ВД
                </span>

            </div>


            <div class="content">

                <div
                    class="content-index"
                    id="contentIndex"
                >
                    00
                </div>

                <div class="content-main">

                    <h1 id="title">
                        THE<br>
                        HOTEL
                    </h1>

                    <p id="description">
                        Пространство,
                        созданное для
                        тишины.
                    </p>

                </div>

            </div>


            <!-- NAVIGATION -->

            <nav class="navigation">

                <button
                    class="nav-item active"
                    data-section="hotel"
                >
                    <span>01</span>
                    <strong>ОТЕЛЬ</strong>
                </button>

                <button
                    class="nav-item"
                    data-section="arrival"
                >
                    <span>02</span>
                    <strong>ПРИБЫТИЕ</strong>
                </button>

                <button
                    class="nav-item"
                    data-section="space"
                >
                    <span>03</span>
                    <strong>ПРОСТРАНСТВО</strong>
                </button>

                <button
                    class="nav-item"
                    data-section="rooms"
                >
                    <span>04</span>
                    <strong>НОМЕРА</strong>
                </button>

                <button
                    class="nav-item"
                    data-section="details"
                >
                    <span>05</span>
                    <strong>ДЕТАЛИ</strong>
                </button>

            </nav>


            <!-- CONTROLS -->

            <div class="controls">

                <button
                    class="arrow-button"
                    id="prevButton"
                    aria-label="Предыдущий кадр"
                >
                    ←
                </button>


                <button
                    class="booking-trigger"
                    id="bookingButton"
                    aria-label="Открыть бронирование"
                >
                    <span>БРОНЬ</span>
                    <i>↗</i>
                </button>


                <button
                    class="arrow-button"
                    id="nextButton"
                    aria-label="Следующий кадр"
                >
                    →
                </button>

            </div>

        </section>

    </main>


    <!-- MENU -->

    <div
        class="menu-overlay"
        id="menuOverlay"
    >

        <div class="menu-inner">

            <div class="menu-top">

                <span>НАВИГАЦИЯ</span>

                <span>THE HOTEL / 2026</span>

            </div>


            <div class="menu-grid">

                <button data-section="hotel">

                    <small>01</small>

                    <span>ОТЕЛЬ</span>

                </button>


                <button data-section="arrival">

                    <small>02</small>

                    <span>ПРИБЫТИЕ</span>

                </button>


                <button data-section="space">

                    <small>03</small>

                    <span>ПРОСТРАНСТВО</span>

                </button>


                <button data-section="rooms">

                    <small>04</small>

                    <span>НОМЕРА</span>

                </button>


                <button data-section="details">

                    <small>05</small>

                    <span>ДЕТАЛИ</span>

                </button>

            </div>


            <div class="menu-bottom">

                <span>
                    МОСКВА / РОССИЯ
                </span>

                <button id="closeMenu">
                    ЗАКРЫТЬ ×
                </button>

            </div>

        </div>

    </div>


    <!-- BOOKING -->

    <div
        class="booking-panel"
        id="bookingPanel"
    >

        <button
            id="closeBooking"
            class="close-booking"
        >
            ЗАКРЫТЬ ×
        </button>


        <div class="booking-content">

            <span class="booking-label">
                ПРОЖИВАНИЕ
            </span>

            <h2>
                ВЫБЕРИТЕ<br>
                СВОЁ<br>
                ВРЕМЯ
            </h2>


            <div class="booking-form">

                <div class="booking-field">

                    <small>
                        ЗАСЕЛЕНИЕ
                    </small>

                    <strong>
                        ВЫБРАТЬ ДАТУ
                    </strong>

                </div>


                <div class="booking-field">

                    <small>
                        ВЫЕЗД
                    </small>

                    <strong>
                        ВЫБРАТЬ ДАТУ
                    </strong>

                </div>


                <div class="booking-field">

                    <small>
                        ГОСТИ
                    </small>

                    <strong>
                        2 ГОСТЯ
                    </strong>

                </div>


                <button
                    class="request-button"
                    id="requestButton"
                >
                    ОСТАВИТЬ ЗАПРОС
                    <span>↗</span>
                </button>

            </div>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
