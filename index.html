<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>THE HOTEL — Сургут</title>

    <meta
        name="description"
        content="THE HOTEL — пространство для отдыха и личного времени в Сургуте."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Manrope:wght@400;500&family=Playfair+Display:wght@400;500&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="site">

    <!-- ======================================
         ОСНОВНОЙ ЭКРАН
    ======================================= -->

    <main class="experience">

        <div class="photo-layer">
            <img
                id="mainImage"
                src="IMG_8684.png"
                alt="THE HOTEL — Сургут"
            >

            <div class="photo-shade"></div>
        </div>


        <!-- ВЕРХНЯЯ ПАНЕЛЬ -->

        <header class="topbar">

            <button
                class="burger"
                id="menuButton"
                aria-label="Открыть меню"
            >
                <span></span>
                <span></span>
            </button>


            <button
                class="hotel-logo"
                id="homeButton"
            >
                THE HOTEL
            </button>


            <button
                class="book-top"
                id="bookingButton"
            >
                БРОНИРОВАТЬ
            </button>

        </header>


        <!-- ИНФОРМАЦИЯ О КАДРЕ -->

        <section class="frame-info">

            <div class="frame-label">

                <span id="frameCategory">ОТЕЛЬ</span>

                <i></i>

                <span id="frameIndex">00</span>

            </div>


            <h1 id="frameTitle">
                THE HOTEL
            </h1>


            <p id="frameDescription">
                Пространство,<br>
                созданное для<br>
                тишины.
            </p>

        </section>


        <!-- СЧЁТЧИК -->

        <div class="frame-counter">

            <span id="currentNumber">01</span>

            <div></div>

            <span>15</span>

        </div>


        <!-- СТРЕЛКИ -->

        <div class="slide-controls">

            <button
                id="prevButton"
                aria-label="Предыдущий кадр"
            >
                <span>←</span>
            </button>

            <button
                id="nextButton"
                aria-label="Следующий кадр"
            >
                <span>→</span>
            </button>

        </div>


        <!-- НИЖНЯЯ НАВИГАЦИЯ -->

        <nav class="bottom-navigation">

            <button
                class="bottom-item active"
                data-section="hotel"
            >
                <span>00</span>
                <strong>ОТЕЛЬ</strong>
            </button>

            <button
                class="bottom-item"
                data-section="arrival"
            >
                <span>01</span>
                <strong>ПРИБЫТИЕ</strong>
            </button>

            <button
                class="bottom-item"
                data-section="space"
            >
                <span>03</span>
                <strong>ПРОСТРАНСТВО</strong>
            </button>

            <button
                class="bottom-item"
                data-section="rooms"
            >
                <span>08</span>
                <strong>НОМЕРА</strong>
            </button>

            <button
                class="bottom-item"
                data-section="details"
            >
                <span>11</span>
                <strong>ДЕТАЛИ</strong>
            </button>

        </nav>

    </main>


    <!-- ======================================
         МЕНЮ
    ======================================= -->

    <aside
        class="menu"
        id="menu"
    >

        <div class="menu-inner">

            <div class="menu-header">

                <span>THE HOTEL / СУРГУТ</span>

                <button id="closeMenu">
                    ЗАКРЫТЬ
                </button>

            </div>


            <div class="menu-title">

                <small>НАВИГАЦИЯ</small>

                <h2>
                    ВАШЕ<br>
                    ПРОСТРАНСТВО
                </h2>

            </div>


            <nav class="menu-links">

                <button data-section="hotel">
                    <span>00</span>
                    <strong>ОТЕЛЬ</strong>
                    <em>→</em>
                </button>

                <button data-section="arrival">
                    <span>01</span>
                    <strong>ПРИБЫТИЕ</strong>
                    <em>→</em>
                </button>

                <button data-section="space">
                    <span>03</span>
                    <strong>ПРОСТРАНСТВО</strong>
                    <em>→</em>
                </button>

                <button data-section="rooms">
                    <span>08</span>
                    <strong>НОМЕРА</strong>
                    <em>→</em>
                </button>

                <button data-section="details">
                    <span>11</span>
                    <strong>ДЕТАЛИ</strong>
                    <em>→</em>
                </button>

            </nav>


            <div class="menu-bottom">

                <span>СУРГУТ / РОССИЯ</span>

                <span>THE HOTEL</span>

            </div>

        </div>

    </aside>


    <!-- ======================================
         БРОНИРОВАНИЕ
    ======================================= -->

    <aside
        class="booking"
        id="booking"
    >

        <div class="booking-inner">

            <div class="booking-header">

                <span>THE HOTEL / СУРГУТ</span>

                <button id="closeBooking">
                    ЗАКРЫТЬ
                </button>

            </div>


            <div class="booking-main">

                <small>БРОНИРОВАНИЕ</small>

                <h2>
                    ВАШЕ<br>
                    ВРЕМЯ
                </h2>

                <p>
                    Выберите даты проживания
                    и количество гостей.
                </p>

            </div>


            <div class="booking-fields">

                <button class="date-field">

                    <span>ЗАСЕЛЕНИЕ</span>

                    <strong>
                        ДД / ММ / ГГГГ
                    </strong>

                </button>


                <button class="date-field">

                    <span>ВЫЕЗД</span>

                    <strong>
                        ДД / ММ / ГГГГ
                    </strong>

                </button>


                <button class="date-field">

                    <span>ГОСТИ</span>

                    <strong>
                        2 ГОСТЯ
                    </strong>

                </button>


                <button
                    class="send-booking"
                    id="sendBooking"
                >
                    <span>ОСТАВИТЬ ЗАПРОС</span>
                    <b>→</b>
                </button>

            </div>


            <div class="booking-footer">

                <span>СУРГУТ / РОССИЯ</span>

                <span>THE HOTEL</span>

            </div>

        </div>

    </aside>

</div>


<script src="script.js"></script>

</body>
</html>
