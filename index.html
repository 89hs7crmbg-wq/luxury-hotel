<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THE HOTEL</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <button class="brand" id="homeBtn">
            THE HOTEL
        </button>

        <div class="header-center">
            MOSCOW / RUSSIA
        </div>

        <button class="menu-button" id="menuButton">
            <span>MENU</span>
            <i></i>
        </button>

    </header>


    <!-- MAIN -->

    <main class="main">

        <!-- IMAGE AREA -->

        <section class="visual">

            <div class="image-wrap" id="imageWrap">

                <img
                    id="mainImage"
                    src="IMG_8684.png"
                    alt="THE HOTEL"
                >

            </div>


            <div class="image-number">

                <span id="currentNumber">01</span>

                <span class="line"></span>

                <span>15</span>

            </div>


            <div class="image-counter">
                DISCOVER
            </div>

        </section>


        <!-- INFORMATION -->

        <section class="info">

            <div class="info-top">

                <span class="category" id="category">
                    THE HOTEL
                </span>

                <span class="coordinates" id="coordinates">
                    55°45' N / 37°37' E
                </span>

            </div>


            <div class="content">

                <div class="content-index" id="contentIndex">
                    00
                </div>

                <div class="content-main">

                    <h1 id="title">
                        THE<br>
                        HOTEL
                    </h1>

                    <p id="description">
                        Пространство,
                        созданное для
                        тишины.
                    </p>

                </div>

            </div>


            <!-- NAVIGATION -->

            <nav class="navigation">

                <button
                    class="nav-item active"
                    data-index="0"
                >
                    <span>01</span>
                    HOTEL
                </button>

                <button
                    class="nav-item"
                    data-index="1"
                >
                    <span>02</span>
                    ARRIVAL
                </button>

                <button
                    class="nav-item"
                    data-index="2"
                >
                    <span>03</span>
                    SPACE
                </button>

                <button
                    class="nav-item"
                    data-index="3"
                >
                    <span>04</span>
                    ROOMS
                </button>

                <button
                    class="nav-item"
                    data-index="4"
                >
                    <span>05</span>
                    DETAILS
                </button>

            </nav>


            <!-- CONTROLS -->

            <div class="controls">

                <button id="prevButton">
                    ←
                </button>

                <span>
                    EXPLORE
                </span>

                <button id="nextButton">
                    →
                </button>

            </div>

        </section>

    </main>


    <!-- MENU -->

    <div class="menu-overlay" id="menuOverlay">

        <div class="menu-inner">

            <div class="menu-heading">
                EXPLORE
            </div>

            <button data-menu="0">
                <span>01</span>
                HOTEL
            </button>

            <button data-menu="1">
                <span>02</span>
                ARRIVAL
            </button>

            <button data-menu="2">
                <span>03</span>
                SPACE
            </button>

            <button data-menu="3">
                <span>04</span>
                ROOMS
            </button>

            <button data-menu="4">
                <span>05</span>
                DETAILS
            </button>

            <button id="closeMenu">
                CLOSE ×
            </button>

        </div>

    </div>


    <!-- BOOKING -->

    <div class="booking-panel" id="bookingPanel">

        <button id="closeBooking">
            CLOSE ×
        </button>

        <div class="booking-content">

            <span>PRIVATE STAY</span>

            <h2>
                BOOK<br>
                YOUR<br>
                ROOM
            </h2>

            <div class="booking-row">

                <div>
                    <small>CHECK IN</small>
                    <strong>— / — / —</strong>
                </div>

                <div>
                    <small>CHECK OUT</small>
                    <strong>— / — / —</strong>
                </div>

                <button>
                    REQUEST
                </button>

            </div>

        </div>

    </div>


</div>


<script src="script.js"></script>

</body>
</html>
